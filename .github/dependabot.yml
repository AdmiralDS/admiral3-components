version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      exclude:
        - '@admiral-ds/admiral3-icons'
        - '@admiral-ds/admiral3-tokens'
    versioning-strategy: 'increase'
    allow:
      - dependency-name: '@admiral-ds/admiral3-icons'
      - dependency-name: '@admiral-ds/admiral3-tokens'
